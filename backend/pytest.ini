[pytest]
testpaths = tests
addopts = -ra
markers =
    postgres: needs a real PostgreSQL server (TEST_DATABASE_URL); skipped when it is not set
filterwarnings =
    error
    # Starlette 1.x recommends the httpx2 fork for its TestClient; the project standardizes on httpx.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
