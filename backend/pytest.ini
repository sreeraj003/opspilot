[pytest]
testpaths = tests
addopts = -ra
markers =
    postgres: needs a real, disposable PostgreSQL database (TEST_DATABASE_URL); skipped when it is not set
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    error
    # Starlette 1.x recommends the httpx2 fork for its TestClient; the project standardizes on httpx.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
