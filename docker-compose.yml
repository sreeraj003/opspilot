# OpsPilot AI: PostgreSQL + backend + frontend.
#
#   cp .env.example .env    # then set POSTGRES_PASSWORD (and SECRET_KEY for production)
#   docker compose up --build
#
# PostgreSQL sits on the internal "data" network only and is not published to
# the host. For local tooling, add docker-compose.dev.yml (see README).

name: opspilot

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-OpsPilot AI}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opspilot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-opspilot}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      SESSION_ABSOLUTE_MAX_DAYS: ${SESSION_ABSOLUTE_MAX_DAYS:-30}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-strict}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_RECORD_CLIENT_METADATA: ${AUTH_RECORD_CLIENT_METADATA:-true}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      PASSWORD_RESET_ADMIN_LINKS_ENABLED: ${PASSWORD_RESET_ADMIN_LINKS_ENABLED:-true}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCKOUT_BASE_SECONDS: ${LOGIN_LOCKOUT_BASE_SECONDS:-60}
      LOGIN_LOCKOUT_MAX_SECONDS: ${LOGIN_LOCKOUT_MAX_SECONDS:-900}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
      AUTH_RATE_LIMIT_PER_IP: ${AUTH_RATE_LIMIT_PER_IP:-30}
      AUTH_RATE_LIMIT_PER_ACCOUNT: ${AUTH_RATE_LIMIT_PER_ACCOUNT:-10}
      AUTH_REFRESH_RATE_LIMIT_PER_IP: ${AUTH_REFRESH_RATE_LIMIT_PER_IP:-300}
      SCHEMA_IMPORT_MAX_BYTES: ${SCHEMA_IMPORT_MAX_BYTES:-5242880}
      SCHEMA_IMPORT_MAX_DEPTH: ${SCHEMA_IMPORT_MAX_DEPTH:-10}
      SCHEMA_MAX_TABLES: ${SCHEMA_MAX_TABLES:-2000}
      SCHEMA_MAX_COLUMNS_PER_TABLE: ${SCHEMA_MAX_COLUMNS_PER_TABLE:-1000}
      SCHEMA_MAX_RELATIONSHIPS: ${SCHEMA_MAX_RELATIONSHIPS:-5000}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - web
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-10000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web
    ports:
      - "${FRONTEND_PORT:-5173}:8080"

networks:
  # Internal network: the database has no route outside Docker.
  data:
    internal: true
  web:

volumes:
  postgres_data:
