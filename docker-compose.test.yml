# Disposable PostgreSQL for backend tests. Separate Compose project, separate
# credentials, no volume (data lives in memory and is gone after `down`), and
# published on 127.0.0.1 only. It never touches the application database.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   set TEST_DATABASE_URL (see .env.example), then run pytest in backend/
#   docker compose -f docker-compose.test.yml down
#
# The default password is intentionally not secret: this database holds only
# throwaway test rows and is reachable from this machine only.

name: opspilot-test

services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-opspilot_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-opspilot_test}
      POSTGRES_DB: opspilot_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d opspilot_test"]
      interval: 2s
      timeout: 3s
      retries: 15
